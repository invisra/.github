name: Reusable API client workflow lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check -
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Lint workflows
        shell: bash
        run: ./actionlint

      - name: Require immutable external action refs
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          while IFS= read -r -d '' file; do
            while IFS=: read -r line_number target; do
              target="${target#"${target%%[![:space:]]*}"}"
              target="${target%%[[:space:]#]*}"

              if [[ "$target" == ./* ]]; then
                continue
              fi

              ref="${target##*@}"
              if [[ "$target" != *@* || ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                echo "$file:$line_number: mutable external action ref: $target" >&2
                failures=1
              fi
            done < <(grep -nE '^[[:space:]]*uses:[[:space:]]+[^#[:space:]]+' "$file" | sed -E 's/^([0-9]+):[[:space:]]*uses:[[:space:]]+/\1:/' || true)
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          if (( failures != 0 )); then
            exit 1
          fi

          echo "All external workflow action refs are pinned to immutable commit SHAs."
