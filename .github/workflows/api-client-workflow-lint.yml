name: Reusable API client workflow lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v7

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check -
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Lint workflows
        shell: bash
        run: ./actionlint
