name: Reusable API client observability

on:
  workflow_call:
    inputs:
      contract-ref:
        description: Immutable invisra/.github ref containing the observability contract, validator, and generator
        required: true
        type: string
      node-version:
        description: Node.js version used for validation and generation
        required: false
        type: string
        default: "24"
      manifest-path:
        description: Repository-relative API coverage manifest path
        required: false
        type: string
        default: api-coverage.json
      generator-config-path:
        description: Repository-relative shared capability generator config
        required: false
        type: string
        default: operation-capabilities.config.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout observability contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: invisra/.github
          ref: ${{ inputs.contract-ref }}
          path: .invisra-observability-contract
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Validate operation semantics
        run: >-
          node .invisra-observability-contract/scripts/validate-api-client-observability.mjs
          "${{ inputs.manifest-path }}"
          .invisra-observability-contract/contracts/api-client-observability-v1.json
      - name: Verify generated capability registries
        run: >-
          node .invisra-observability-contract/scripts/generate-api-client-operation-capabilities.mjs
          --config "${{ inputs.generator-config-path }}"
          --check
