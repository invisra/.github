name: Shared tooling tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/api-client-coverage.yml"
      - ".github/workflows/shared-tooling-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/api-client-coverage.yml"
      - ".github/workflows/shared-tooling-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run shared tooling tests
        run: node --test tests/*.test.mjs
