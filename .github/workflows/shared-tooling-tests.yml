name: Shared tooling tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Run shared tooling tests
        run: node --test tests/*.test.mjs
